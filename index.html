<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A zero-dependency todo app built with plain HTML, CSS and vanilla JavaScript, storing your list in the browser.">
<title>TodoAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>TodoAI</h1>
    <form id="todo-form" class="add" autocomplete="off">
      <label for="todo-input" class="sr-only">New todo</label>
      <input id="todo-input" class="field" type="text" placeholder="What needs to be done?" required>
      <button type="submit" class="primary">Add</button>
    </form>
    <ul id="todo-list" class="list" aria-label="Todos"></ul>
    <footer class="bar">
      <span id="count" class="count" role="status">0 items left</span>
      <div class="filters" role="group" aria-label="Filter todos">
        <button type="button" data-filter="all" class="filter active" aria-pressed="true">All</button>
        <button type="button" data-filter="active" class="filter" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" class="filter" aria-pressed="false">Done</button>
      </div>
      <button id="clear-done" type="button" class="clear">Clear done</button>
    </footer>
    <p id="announcer" class="sr-only" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
